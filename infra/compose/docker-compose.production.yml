# Stack production. Chạy qua infra/scripts/lib.sh (compose project: ultimate-tckt-production).
services:
  core-db:
    image: mysql:8
    restart: unless-stopped
    ports:
      - "127.0.0.1:3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${CORE_MYSQL_ROOT_PASSWORD:?}
      MYSQL_DATABASE: ${CORE_DB_NAME:?}
      MYSQL_USER: ${CORE_DB_USER:?}
      MYSQL_PASSWORD: ${CORE_DB_PASSWORD:?}

    volumes:
      - core_mysql:/var/lib/mysql
      - ../seed/core-db.sql:/docker-entrypoint-initdb.d/init.sql:ro

  core:
    image: ghcr.io/tduong-p/ultimate-tckt-core:${CORE_IMAGE_TAG:?}
    restart: unless-stopped
    depends_on:
      - core-db
    environment:
      TZ: Asia/Ho_Chi_Minh
      NODE_ENV: production
      PORT: 3000
      DB_HOST: core-db
      DB_PORT: 3306
      DB_NAME: ${CORE_DB_NAME:?}
      DB_USER: ${CORE_DB_USER:?}
      DB_PASSWORD: ${CORE_DB_PASSWORD:?}
      SESSION_SECRET: ${CORE_SESSION_SECRET:?}
      SETTINGS_ENCRYPTION_KEY: ${CORE_SETTINGS_ENCRYPTION_KEY:?}
      DEVOPS_EMAILS: ${CORE_DEVOPS_EMAILS:-}
      APP_BASE_URL: https://tckt-hub.duckdns.org
      APP_ENV: production
      EMAIL_NOTIFICATIONS_ENABLED: "false"
      # Thông báo đi qua Noti (docs/dev/email-cron.md). Key trống = Core không gửi gì, vẫn chạy (công tắc tắt khẩn cấp).
      NOTI_URL: http://noti-api:8000
      NOTI_API_KEY: ${CORE_NOTI_API_KEY:-}
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - core_uploads:/app/storage/task-attachments

  ctd-db:
    image: postgres:16
    restart: unless-stopped
    environment:
      TZ: Asia/Ho_Chi_Minh
      POSTGRES_DB: ${CTD_DB_NAME:?}
      POSTGRES_USER: ${CTD_DB_USER:?}
      POSTGRES_PASSWORD: ${CTD_DB_PASSWORD:?}
    command: --default-time-zone='+07:00'
    volumes:
      - ctd_postgres:/var/lib/postgresql/data

  ctd-api:
    image: ghcr.io/tduong-p/ultimate-tckt-ctd-api:${CTD_API_IMAGE_TAG:?}
    restart: unless-stopped
    depends_on:
      - ctd-db
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://${CTD_DB_USER:?}:${CTD_DB_PASSWORD:?}@ctd-db:5432/${CTD_DB_NAME:?}
      JWT_SECRET: ${CTD_JWT_SECRET:?}
      MAILER_DRIVER: console
      STORAGE_DRIVER: local
      LOCAL_STORAGE_DIR: /app/storage/documents
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - ctd_documents:/app/storage/documents

  # Noti (SPEC-NOTI-001, SPEC-MAIL-001): một image, hai service. Database `noti` riêng trên ctd-db production
  # (role/database tạo tay một lần, xem docs/ops/moi-truong.md). Cổng 8101 khác cổng Noti của staging (cùng VM).
  # Allowlist bắt buộc khác rỗng: rỗng nghĩa là gửi cho mọi người.
  noti-api:
    image: ghcr.io/tduong-p/ultimate-tckt-noti:${NOTI_IMAGE_TAG:?}
    restart: unless-stopped
    depends_on:
      - ctd-db
    environment: &noti-env
      NOTI_DATABASE_URL: postgresql+psycopg://${NOTI_DB_USER:?}:${NOTI_DB_PASSWORD:?}@ctd-db:5432/${NOTI_DB_NAME:?}
      NOTI_APP_BASE_URL: https://tckt-hub.duckdns.org
      NOTI_MAIL_DRIVER: ${NOTI_MAIL_DRIVER:-console}
      NOTI_MAIL_FROM: ${NOTI_MAIL_FROM:-noti@example.invalid}
      NOTI_RECIPIENT_ALLOWLIST: ${NOTI_RECIPIENT_ALLOWLIST:?}
      NOTI_REDIRECT_TO: ${NOTI_REDIRECT_TO:-}
      NOTI_SMTP_HOST: ${NOTI_SMTP_HOST:-}
      NOTI_SMTP_PORT: ${NOTI_SMTP_PORT:-587}
      NOTI_SMTP_USER: ${NOTI_SMTP_USER:-}
      NOTI_SMTP_PASSWORD: ${NOTI_SMTP_PASSWORD:-}
      NOTI_GRAPH_TENANT: ${NOTI_GRAPH_TENANT:-}
      NOTI_GRAPH_CLIENT_ID: ${NOTI_GRAPH_CLIENT_ID:-}
      NOTI_GRAPH_CLIENT_SECRET: ${NOTI_GRAPH_CLIENT_SECRET:-}
    ports:
      - "127.0.0.1:8101:8000"

  noti-worker:
    image: ghcr.io/tduong-p/ultimate-tckt-noti:${NOTI_IMAGE_TAG:?}
    restart: unless-stopped
    depends_on:
      - noti-api
    command: ["python", "-m", "noti.worker"]
    environment: *noti-env

volumes:
  core_mysql:
  core_uploads:
  ctd_postgres:
  ctd_documents:
