<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Công tác Đảng (CTD) - Ultimate TCKT</title>
  </head>
  <body>
    <div id="root"></div>
    <div id="error-overlay" style="position:fixed;top:0;left:0;right:0;background:rgba(255,0,0,0.8);color:white;z-index:9999;padding:20px;display:none;font-family:monospace;white-space:pre-wrap;"></div>
    <script>
      window.addEventListener('error', (event) => {
        const el = document.getElementById('error-overlay');
        el.style.display = 'block';
        el.innerText += event.error ? event.error.stack : event.message + '\n';
      });
      window.addEventListener('unhandledrejection', (event) => {
        const el = document.getElementById('error-overlay');
        el.style.display = 'block';
        el.innerText += 'Unhandled Promise Rejection: ' + (event.reason ? (event.reason.stack || event.reason) : event) + '\n';
      });
    </script>
    <script type="module" src="/src/ctd/main.tsx"></script>
  </body>
</html>
