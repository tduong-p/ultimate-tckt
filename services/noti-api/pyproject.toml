[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "noti-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy>=2.0.36",
  "psycopg[binary]>=3.2",
  "alembic>=1.14",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "email-validator>=2.2",
  "jinja2>=3.1",
  "pyyaml>=6.0",
  "css-inline>=0.14",
  "httpx>=0.27",
  "msal>=1.31",
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[tool.setuptools]
packages = ["noti", "noti.drivers"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
